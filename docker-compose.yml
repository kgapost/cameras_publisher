# SWARMER deployment on the Jetson (mission computer):
#   docker compose up -d        # builds the image the first time
# Run ONE cameras-publisher per drone; visual_odometry and obstacle_detection read its topics.
services:
  cameras-publisher:
    image: cameras-publisher:latest
    build: .
    container_name: cameras-publisher
    runtime: nvidia            # mounts the Jetson camera plugins (nvarguscamerasrc, nvvidconv)
    network_mode: host         # ROS 2 / DDS discovery
    # HTTP listens directly on CP_HTTP_API_PORT (default 8000); host networking needs no ports mapping.
    privileged: true           # every /dev/video* (the USB belly camera's node can change) + CSI VI/ISP nodes
    restart: unless-stopped    # also retries when no camera is found at start-up
    stop_signal: SIGINT
    env_file:
      - .env                    # camera selection, ROS domain, capture API and calibration
    environment:
      CP_CAPTURE_DIRECTORY: ${CP_CAPTURE_DIRECTORY:-/workspace/captures} # match the volume target
    volumes:
      - /tmp/argus_socket:/tmp/argus_socket   # nvargus-daemon on the host (CSI cameras)
      - ./logs:/workspace/logs
      - camera-captures:${CP_CAPTURE_DIRECTORY:-/workspace/captures} # persistent JPEG/MP4 files
    # Camera selection and backends come from .env; no CLI overrides.
    command: python3 publish_cameras.py

volumes:
  camera-captures:
